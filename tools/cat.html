<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Texture Viewer</title>
<!-- Adult cat model and UV layout written from Minecraft's cat model; verified against the vanilla 26.3 textures
     (every painted vanilla pixel falls on a model face). Textures come from textures.json next to this page. -->
<style>body{margin:0;background:#16181c;color:#e8e8e8;font:14px system-ui,sans-serif}
#bar{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:#2a2e36;color:#e8e8e8;border:1px solid #444;border-radius:6px;padding:6px 10px;cursor:pointer}
button.on{background:#4a6;border-color:#4a6}#v{width:100vw;height:calc(100vh - 60px);display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="bar"><span>Drag to turn, scroll to zoom.</span></div>
<canvas id="v"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
let TEX=[];
const cv=document.getElementById("v"), r=new THREE.WebGLRenderer({canvas:cv,antialias:true});
r.setPixelRatio(devicePixelRatio);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x16181c);
const cam=new THREE.PerspectiveCamera(35,1,0.01,50); cam.position.set(2.2,1.4,-2.6);
const ctl=new OrbitControls(cam,cv); ctl.target.set(0,0.6,0); ctl.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x888888,2.2)); const dl=new THREE.DirectionalLight(0xffffff,1.2); dl.position.set(2,4,-3); scene.add(dl);
const mat=new THREE.MeshLambertMaterial({alphaTest:0.1,side:THREE.DoubleSide});
// Box with Minecraft's UV layout (model units, y down), as ModelPart.Cube builds it.
function cube(u,v,x0,y0,z0,w,h,d){
  const x1=x0+w,y1=y0+h,z1=z0+d;
  const V=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
  const f4=u,f5=u+d,f6=u+d+w,f7=u+d+w+w,f8=u+d+w+d,f9=u+d+w+d+w,f10=v,f11=v+d,f12=v+d+h;
  const F=[[[5,4,0,1],f5,f10,f6,f11],[[2,3,7,6],f6,f11,f7,f10],[[0,4,7,3],f4,f11,f5,f12],
           [[1,0,3,2],f5,f11,f6,f12],[[5,1,2,6],f6,f11,f8,f12],[[4,5,6,7],f8,f11,f9,f12]];
  const pos=[],uv=[];
  for(const [vi,u0,v0,u1,v1] of F){
    const q=vi.map(i=>V[i].map(c=>c/16)), t=[[u1,v0],[u0,v0],[u0,v1],[u1,v1]].map(([a,b])=>[a/64,1-b/32]);
    for(const k of [0,1,2,0,2,3]){pos.push(...q[k]);uv.push(...t[k]);}
  }
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2)); g.computeVertexNormals(); return new THREE.Mesh(g,mat);
}
function part(px,py,pz,rx,cubes){const g=new THREE.Group(); g.position.set(px/16,py/16,pz/16); g.rotation.set(rx,0,0,"ZYX"); cubes.forEach(c=>g.add(c)); return g;}
const root=new THREE.Group(); root.scale.set(-1,-1,1); root.position.y=1.5; scene.add(root);
root.add(part(0,15,-9,0,[cube(0,0,-2.5,-2,-3,5,4,5),cube(0,24,-1.5,0,-4,3,2,2),cube(0,10,-2,-3,0,1,1,2),cube(6,10,1,-3,0,1,1,2)]));
root.add(part(0,12,-10,Math.PI/2,[cube(20,0,-2,3,-8,4,16,6)]));
root.add(part(0,15,8,0.9,[cube(0,15,-0.5,0,0,1,8,1)]));
root.add(part(0,20,14,1.7278759,[cube(4,15,-0.5,0,0,1,8,1)]));
for(const x of [1.1,-1.1]) root.add(part(x,18,5,0,[cube(8,13,-1,0,1,2,6,2)]));
for(const x of [1.2,-1.2]) root.add(part(x,14.1,-5,0,[cube(40,0,-1,0,0,2,10,2)]));
const loader=new THREE.TextureLoader(), bar=document.getElementById("bar");
function use(f,b){loader.load(f,t=>{t.magFilter=t.minFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;mat.map=t;mat.needsUpdate=true;});
  bar.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));}
fetch("textures.json",{cache:"no-store"}).then(r=>r.json()).then(list=>{TEX=list;
  TEX.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t.name;b.title=(t.layers||[]).join(" + ");
    b.onclick=()=>use(t.file,b);bar.append(b);if(i===TEX.length-1)use(t.file,b);});});
function size(){const w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener("resize",size); size();
r.setAnimationLoop(()=>{ctl.update();r.render(scene,cam);});
</script></body></html>
